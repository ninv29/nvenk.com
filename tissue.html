<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kidney section | Nithin Venkatramanan</title>
  <meta name="description" content="An interactive simulated kidney section showing podocyte loss in FSGS.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kidney section">
  <meta property="og:description" content="An interactive simulated kidney section showing podocyte loss in FSGS.">
  <meta property="og:image" content="https://nvenk.com/assets/og.png?v=2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg?v=nv2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..500&display=swap">
  <link rel="stylesheet" href="assets/site.css?v=23">
  <script src="assets/figures.js?v=23" defer></script>
</head>
<body>
  <main class="page">
    <a class="back" href="./" data-back><span aria-hidden="true">&larr;</span> Back</a>
    <h1 class="fig-title">Kidney section</h1>
    <p class="lead">A simulated kidney section, colored by cell type. In FSGS, podocytes are lost from some glomeruli, often from only part of each one.</p>
    <figure class="fig" data-fig="tissue">
      <div class="plate tissue-plate" data-plate><span class="tag" data-readout></span></div>
      <div class="controls">
        <label class="ctl"><span>Podocyte injury</span><input type="range" min="0" max="100" value="0" step="1" data-injury><output data-injury-out>0%</output></label>
      </div>
      <div class="stats">
        <div><span class="stat-n" data-stat="pods">0</span><span class="stat-l">podocytes left</span></div>
        <div><span class="stat-n"><span data-stat="gloms">0</span><small>of 5</small></span><span class="stat-l">glomeruli affected</span></div>
      </div>
      <ul class="legend" data-legend aria-label="Cell types"></ul>
    </figure>
  </main>
</body>
</html>
