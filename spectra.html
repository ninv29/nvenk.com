<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spectral matching | Nithin Venkatramanan</title>
  <meta name="description" content="An interactive example of matching an MS/MS spectrum to a library spectrum.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Spectral matching">
  <meta property="og:description" content="An interactive example of matching an MS/MS spectrum to a library spectrum.">
  <meta property="og:image" content="https://nvenk.com/assets/og.png?v=2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg?v=nv2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..500&display=swap">
  <link rel="stylesheet" href="assets/site.css?v=23">
  <script src="assets/figures.js?v=30" defer></script>
</head>
<body>
  <main class="page">
    <a class="back" href="./" data-back><span aria-hidden="true">&larr;</span> Back</a>
    <h1 class="fig-title">Spectral matching</h1>
    <p class="lead">A measured MS/MS spectrum (top) matched against a library spectrum (bottom). Add instrument drift to see when peaks stop matching.</p>
    <figure class="fig spec" data-fig="spectra">
      <div class="plate" data-plate></div>
      <div class="fig-bar fig-bar-sub"><span>Mass error (ppm)</span><span data-offset></span></div>
      <div class="plate" data-err></div>
      <div class="controls">
        <label class="ctl"><span>Instrument drift</span><input type="range" min="-25" max="25" value="0" step="0.5" data-drift><output data-drift-out>0 ppm</output></label>
        <label class="ctl"><span>Tolerance</span><input type="range" min="2" max="40" value="10" step="0.5" data-tol><output data-tol-out>10 ppm</output></label>
        <label class="ctl"><span>Retention time shift</span><input type="range" min="0" max="30" value="2" step="0.5" data-rt><output data-rt-out>2 s</output></label>
        <div class="checks">
          <label><input type="checkbox" data-model> Weight by error</label>
          <label><input type="checkbox" data-recal> Correct for drift</label>
        </div>
      </div>
      <div class="stats">
        <div><span class="stat-n"><span data-stat="matched">0</span><small>of 16</small></span><span class="stat-l">peaks matched</span></div>
        <div><span class="stat-n" data-stat="cos">0.000</span><span class="stat-l">similarity</span></div>
        <div><span class="stat-n" data-stat="score">0.000</span><span class="stat-l">score with retention time</span></div>
      </div>
    </figure>
  </main>
</body>
</html>
